on:
  pull_request:
    - workflows: [python-ci]
      filter:
        source_branches: ["**"]
        target_branches: ["main", "master"]

  push:
    - workflows: [python-ci]
      filter:
        branches: ["main", "master", "ci"]

workflows:
  python-ci:
    tasks:
      - name: sphinx-docs
        cubes:
          - name: sphinx-html
            image: docker.io/library/python:3.13.3-alpine3.20
            script:
              - cd "$SOURCECRAFT_WORKSPACE"
              - python -m pip install --upgrade pip --root-user-action=ignore
              - python -m pip install sphinx django --root-user-action=ignore
              - apk add --no-cache make
              - cd docs
              - sphinx-build -M html . _build -v
            artifacts:
                paths:
                  - docs/build/html/
