<style>
/* --- ОБЫЧНЫЕ СТИЛИ (ПО УМОЛЧАНИЮ) --- */
.crazy-neon-footer {
    transition: all 0.3s ease;
}
.crazy-text {
    transition: all 0.3s ease;
}
.crazy-logo svg, .crazy-icon svg {
    transition: fill 0.3s ease;
}

/* Стили для кнопки переключения */
.toggle-trash-btn {
    background: #212529;
    color: #fff;
    border: 2px solid #6c757d;
    padding: 5px 15px;
    font-size: 0.9rem;
    font-weight: bold;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s ease;
    z-index: 999;
}
.toggle-trash-btn:hover {
    background: #343a40;
    border-color: #fff;
}

/* --- ВЫРВИГЛАЗНЫЙ РЕЖИМ (включается через класс .active-trash) --- */
.active-trash.crazy-neon-footer {
    background: linear-gradient(45deg, #ff00ff, #00ffff, #00ff00, #ffff00, #ff0000, #ff00ff) !important;
    background-size: 400% 400% !important;
    animation: rainbowBackground 1.5s linear infinite !important;
    border-top: 10px dashed #00ff00 !important;
    box-shadow: 0 0 50px #ff00ff, inset 0 0 30px #00ffff !important;
    padding: 25px !important;
    overflow: hidden;
}

.active-trash .crazy-text {
    font-family: "Impact", "Arial Black", sans-serif !important;
    font-size: 1.8rem !important;
    font-weight: bold !important;
    color: #fff !important;
    text-shadow: 0 0 10px #00ff00, 0 0 20px #ff0000, 0 0 30px #ffff00 !important;
    animation: blinkText 0.3s ease-in-out infinite alternate !important;
    display: inline-block;
}

.active-trash .crazy-logo svg {
    fill: #ffff00 !important;
    filter: drop-shadow(0 0 15px #00ffff) drop-shadow(0 0 30px #ff00ff) !important;
    animation: spin 0.8s linear infinite !important;
}

.active-trash .crazy-icon svg {
    filter: drop-shadow(0 0 20px #ff00ff) drop-shadow(0 0 40px #00ffff) !important;
    animation: spinReverse 0.5s infinite linear, changeColor 0.8s infinite linear !important;
}

/* Кнопка в режиме трэша */
.active-trash .toggle-trash-btn {
    background: #ffff00 !important;
    color: #ff00ff !important;
    border: 5px double #00ffff !important;
    font-size: 1.2rem !important;
    animation: spin 2s linear infinite, changeColor 0.5s infinite linear !important;
}

/* --- АНИМАЦИИ --- */
@keyframes rainbowBackground {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
@keyframes blinkText {
    0% { opacity: 0.3; transform: scale(0.9) skewX(-15deg); color: #ff00ff; }
    100% { opacity: 1; transform: scale(1.2) skewX(15deg); color: #ffff00; }
}
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
@keyframes spinReverse {
    0% { transform: rotate(360deg) scale(0.8); }
    50% { transform: rotate(180deg) scale(1.6); }
    100% { transform: rotate(0deg) scale(0.8); }
}
@keyframes changeColor {
    0% { fill: #00ffff; color: #00ffff; }
    25% { fill: #ff00ff; color: #ff00ff; }
    50% { fill: #ffff00; color: #ffff00; }
    75% { fill: #00ff00; color: #00ff00; }
    100% { fill: #ff0000; color: #ff0000; }
}
</style>

<footer id="mainFooter" class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top crazy-neon-footer">
    <div class="col-md-4 d-flex align-items-center">
        <a href="/" class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1 crazy-logo" aria-label="Bootstrap">
            <svg class="bi" width="30" height="24" aria-hidden="true">
                <use xlink:href="#bootstrap"></use>
            </svg>
        </a>
        <span class="mb-3 mb-md-0 text-body-secondary crazy-text">©since 2009 dmitriy & morax & dark7es</span>
    </div>

    <div class="col-md-4 d-flex justify-content-center my-2 my-md-0">
        <button type="button" class="toggle-trash-btn" onclick="toggleTrashMode()">:0</button>
    </div>

    <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
        <li class="ms-3">
            <a class="text-body-secondary crazy-icon" href="#" aria-label="Instagram">
                <svg class="bi" width="24" height="24" aria-hidden="true">
                    <use xlink:href="#telegram"></use>
                </svg>
            </a>
        </li>
        <li class="ms-3">
            <a class="text-body-secondary crazy-icon" href="#" aria-label="Facebook">
                <svg class="bi" width="24" height="24">
                    <use xlink:href="#facebook"></use>
                </svg>
            </a>
        </li>
    </ul>
</footer>

<script>
function toggleTrashMode() {
    const footer = document.getElementById('mainFooter');
    const btn = footer.querySelector('.toggle-trash-btn');

    footer.classList.toggle('active-trash');

    if (footer.classList.contains('active-trash')) {
        btn.textContent = ':0';
        localStorage.setItem('trashMode', 'enabled');
    } else {
        btn.textContent = 'something';
        localStorage.setItem('trashMode', 'disabled');
    }
}

document.addEventListener("DOMContentLoaded", function() {
    if (localStorage.getItem('trashMode') === 'enabled') {
        toggleTrashMode();
    }
});
</script>
