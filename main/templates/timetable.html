{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<!-- Стили теперь берутся из основного style.css -->
{% endblock %}

{% block content %}
<div class="train-search-container">
    <h2>🚆 Поиск поездов</h2>

    <div class="search-form">
        <div class="form-group">
            <label>📍 Откуда (код станции)</label>
            <input type="text" id="from_code" placeholder="Например: MOS" value="">
        </div>

        <div class="form-group">
            <label>🎯 Куда (код станции)</label>
            <input type="text" id="to_code" placeholder="Например: SPB" value="">
        </div>

        <div class="form-group">
            <label>📅 Дата поездки</label>
            <input type="date" id="date">
        </div>

        <div class="button-group">
            <button class="btn btn-primary" onclick="searchRoutes()">🔍 Найти поезда</button>
            <button id="togglePastBtn" class="btn btn-secondary" onclick="togglePastTrains()" style="display:none;">
                📅 Показать прошедшие
            </button>
        </div>
    </div>

    <div id="results"></div>
</div>

<script>
let allSegments = []
let showPast = false
let currentTime = ''
let selectedDate = ''

// Устанавливаем сегодняшнюю дату по умолчанию
document.getElementById('date').value = new Date().toISOString().split('T')[0];

function searchRoutes() {
    showLoading(true)

    let r = new XMLHttpRequest()
    let now = new Date()
    currentTime = now.toTimeString().slice(0, 5)
    selectedDate = document.getElementById('date').value

    let fromCode = document.getElementById('from_code').value.trim()
    let toCode = document.getElementById('to_code').value.trim()

    // Валидация
    if (!fromCode || !toCode) {
        showError('Пожалуйста, заполните оба поля "Откуда" и "Куда"')
        showLoading(false)
        return
    }

    let url = "/api/search/?from_code=" + encodeURIComponent(fromCode) +
              "&to_code=" + encodeURIComponent(toCode) +
              "&date=" + selectedDate

    r.open("GET", url)
    r.onload = function() {
        showLoading(false)
        try {
            let response = JSON.parse(r.response)

            if (response.status == 'ok' && response.data && response.data.segments) {
                allSegments = response.data.segments
                showPast = false
                document.getElementById('togglePastBtn').style.display = 'inline-block'
                document.getElementById('togglePastBtn').textContent = '📅 Показать прошедшие'
                renderResults()
            } else {
                allSegments = []
                showPast = false
                document.getElementById('togglePastBtn').style.display = 'none'
                showEmpty('Ничего не найдено. Попробуйте изменить параметры поиска.')
            }
        } catch(e) {
            showError('Ошибка при обработке данных')
        }
    }
    r.onerror = function() {
        showLoading(false)
        showError('Ошибка соединения. Проверьте интернет-соединение.')
    }
    r.send()
}

function togglePastTrains() {
    showPast = !showPast
    let btn = document.getElementById('togglePastBtn')
    if (showPast) {
        btn.textContent = '⏪ Скрыть прошедшие'
    } else {
        btn.textContent = '📅 Показать прошедшие'
    }
    renderResults()
}

function renderResults() {
    let is_today = selectedDate === new Date().toISOString().split('T')[0]

    if (allSegments.length === 0) {
        showEmpty('Ничего не найдено')
        return
    }

    let futureSegments = []
    let pastSegments = []

    if (is_today) {
        for (let i = 0; i < allSegments.length; i++) {
            let s = allSegments[i]
            let departure_time = s.departure ? s.departure.slice(11,16) : null
            if (departure_time && departure_time > currentTime) {
                futureSegments.push(s)
            } else {
                pastSegments.push(s)
            }
        }

        pastSegments.sort((a, b) => {
            let timeA = a.departure ? a.departure.slice(11,16) : '00:00'
            let timeB = b.departure ? b.departure.slice(11,16) : '00:00'
            return timeA.localeCompare(timeB)
        })

        futureSegments.sort((a, b) => {
            let timeA = a.departure ? a.departure.slice(11,16) : '00:00'
            let timeB = b.departure ? b.departure.slice(11,16) : '00:00'
            return timeA.localeCompare(timeB)
        })
    } else {
        futureSegments = [...allSegments]
        pastSegments = []

        futureSegments.sort((a, b) => {
            let timeA = a.departure ? a.departure.slice(11,16) : '00:00'
            let timeB = b.departure ? b.departure.slice(11,16) : '00:00'
            return timeA.localeCompare(timeB)
        })
    }

    let segmentsToShow = []
    if (showPast) {
        segmentsToShow = [...pastSegments, ...futureSegments]
    } else {
        segmentsToShow = futureSegments
    }

    if (segmentsToShow.length === 0) {
        if (is_today && futureSegments.length === 0 && !showPast) {
            showEmpty('На сегодня поездов больше нет')
        } else if (is_today && pastSegments.length === 0 && showPast) {
            showEmpty('Нет прошедших поездов')
        } else {
            showEmpty('Ничего не найдено')
        }
        return
    }

    // Показываем результаты
    let html = '<div class="results-header"><p class="results-count">📊 Найдено поездов: ' + segmentsToShow.length + '</p></div>'

    for (let i = 0; i < segmentsToShow.length; i++) {
        let s = segmentsToShow[i]
        let departure_time = s.departure ? s.departure.slice(11,16) : null
        let isPast = is_today && departure_time && departure_time <= currentTime

        let cardClass = 'train-card'
        if (isPast) {
            cardClass += ' past-train'
        }

        html += '<div class="' + cardClass + '">'

        if (isPast) {
            html += '<div class="past-badge">⏰ ПРОШЕДШИЙ</div>'
        }

        html += '<div class="train-header">'
        html += '<div class="train-number">🚆 Поезд №' + (s.thread?.number || '???') + '</div>'
        html += '<div class="train-title">' + (s.thread?.title || '') + '</div>'
        html += '</div>'

        html += '<div class="train-body">'
        html += '<div class="route-info">'
        html += '<div class="station">'
        html += '<div class="station-label">Откуда</div>'
        html += '<div class="station-name">' + (s.from?.title || '???') + '</div>'
        html += '<div class="station-time">' + (s.departure ? s.departure.slice(11,16) : '???') + '</div>'
        html += '</div>'
        html += '<div class="route-arrow">→</div>'
        html += '<div class="station">'
        html += '<div class="station-label">Куда</div>'
        html += '<div class="station-name">' + (s.to?.title || '???') + '</div>'
        html += '<div class="station-time">' + (s.arrival ? s.arrival.slice(11,16) : '???') + '</div>'
        html += '</div>'
        html += '</div>'

        html += '<div class="duration-info">'
        html += '⏱ В пути: <span>' + Math.floor((s.duration||0)/3600) + 'ч ' + Math.floor(((s.duration||0)%3600)/60) + 'м</span>'
        html += '</div>'

        html += '<div class="price-tag">💰 Цена билета: 2$</div>'

        // Проверка на скорое прибытие
        if (s.arrival) {
            let arrivalTime = new Date(s.arrival)
            let now = new Date()
            let minutesUntil = Math.floor((arrivalTime - now) / 60000)
            if (minutesUntil >= 0 && minutesUntil <= 10) {
                html += '<div class="urgent-alert">'
                html += '<p>🚨 ВНИМАНИЕ! Поезд прибывает через ' + minutesUntil + ' минут!</p>'
                html += '</div>'
            }
        }

        if (!isPast) {
            html += '<a href="/train/?id=' + encodeURIComponent(s.thread?.number || '') +
                   '&from=' + encodeURIComponent(s.from?.title || '') +
                   '&to=' + encodeURIComponent(s.to?.title || '') +
                   '" class="booking-link">✅ Забронировать билет</a>'
        } else {
            html += '<div class="booking-disabled">❌ Бронирование недоступно</div>'
        }

        html += '</div></div>'
    }

    document.getElementById('results').innerHTML = html
}

function showLoading(show) {
    if (show) {
        document.getElementById('results').innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>Поиск поездов...</p></div>'
    }
}

function showError(message) {
    document.getElementById('results').innerHTML = '<div class="empty-state"><p>⚠️ ' + message + '</p></div>'
}

function showEmpty(message) {
    document.getElementById('results').innerHTML = '<div class="empty-state"><p>😔 ' + message + '</p></div>'
}

// Добавляем поддержку Enter для быстрого поиска
document.getElementById('from_code').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') searchRoutes()
})
document.getElementById('to_code').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') searchRoutes()
})
document.getElementById('date').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') searchRoutes()
})
</script>
{% endblock %}
